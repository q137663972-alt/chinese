// 项目级构建脚本（Android Gradle Plugin 8.x）
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.1.4"
    }
}
// 仓库由 settings.gradle 的 dependencyResolutionManagement 统一管理
// （Gradle 8.x 在 FAIL_ON_PROJECT_REPOS 模式下禁止项目级 repositories，故不再声明 allprojects）
