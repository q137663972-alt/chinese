name: Build APK + Deploy H5

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chinese-universal
            artifact: ChinesePlayground-apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # runner 已预装 Android SDK（$ANDROID_HOME 含 API34 / build-tools 34.0.0），
      # 不用第三方 setup-android（近期不稳定，曾导致构建在 16s 内失败）
      - name: Accept Android SDK licenses
        run: 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true'

      - name: Install SDK platform & build-tools (API 34)
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"'

      - name: Download Gradle 8.2 (repo 未带 wrapper jar)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip -d "$HOME/gradle_dist"
          echo "$HOME/gradle_dist/gradle-8.2/bin" >> "$GITHUB_PATH"

      - name: Disable lintVital for release
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/lint.gradle" <<'EOF'
          allprojects { p -> p.afterEvaluate {
            try { p.android.lintOptions.checkReleaseBuilds = false } catch (e) { }
          } }
          EOF

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/ks"
          printf '%s' "$KS_B64" | base64 -d > "$HOME/ks/release.jks"
          chmod 600 "$HOME/ks/release.jks"

      - name: Build release APK (unsigned)
        working-directory: ${{ matrix.project }}
        run: gradle assembleRelease --no-daemon

      - name: Sign APK (apksigner)
        env:
          KS_PASS:   ${{ secrets.KEYSTORE_STORE_PASS }}
          KEY_PASS:  ${{ secrets.KEYSTORE_KEY_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -n "$APKSIGNER" ] || { echo "apksigner not found under $ANDROID_HOME"; exit 1; }
          echo "using $APKSIGNER"
          REL="${{ matrix.project }}/app/build/outputs/apk/release"
          UNSIGNED="$REL/app-release-unsigned.apk"
          [ -f "$UNSIGNED" ] || { echo "unsigned APK missing"; ls -R "$REL"; exit 1; }
          "$APKSIGNER" sign --ks "$HOME/ks/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" \
            --min-sdk-version 21 \
            --v1-signing-enabled true --v2-signing-enabled true \
            --v3-signing-enabled false --v4-signing-enabled false \
            --out "$REL/app-release-signed.apk" "$UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$REL/app-release-signed.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.project }}/app/build/outputs/apk/release/app-release-signed.apk

  pages:
    name: Deploy H5 + 热更包 (GitHub Pages)
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect H5 files
        run: |
          mkdir -p page
          cp index.html page/
          cp -r css js page/
          [ -d img ] && cp -r img page/   # 图片兜底源：热更包没装时 picHTML() 会回落到 https://.../chinese/img/

      - name: 生成热更包（旧通道，v2 及更早的 APK 还在读 hot/manifest.js）
        run: |
          REPO="${{ github.event.repository.name }}"
          node tools/gen-hot.mjs --out page/hot \
            --base "https://${{ github.repository_owner }}.github.io/${REPO}/hot/"

      - name: 生成资源包（v3.0 通道：任意格式 + 玩法热更）
        run: node tools/gen-pack.mjs --out page/hot/pack --min-apk 3   # v3.0 起所有壳都有热更桥，未带桥的更老版本会自动忽略热更包

      - name: 下载已签名 APK（构建失败时跳过，不影响热更发布）
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: apks

      - name: APK 放进 page（应用内升级用）
        run: |
          mkdir -p page/apk
          if [ -d apks ]; then
            for d in apks/*/; do
              n=$(basename "$d")
              out=$(echo "$n" | sed -E 's/-apk$//').apk
              find "$d" -name '*.apk' -exec cp {} "page/apk/$out" \;
            done
          fi
          # 签名 Secrets 没配时构建产不出 APK：退回仓库里已发布的那一份，
          # 保证 Pages 上的下载直链永远有东西可以下
          if [ -z "$(ls -A page/apk 2>/dev/null)" ] && [ -d apk ]; then
            cp apk/*.apk page/apk/ 2>/dev/null || true
          fi
          ls -la page/apk

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./page
          force_orphan: true
