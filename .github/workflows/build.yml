name: Build APK + Deploy H5

on:
  push:
  workflow_dispatch:
    inputs:
      empty_shell:
        description: '产出 2.5.0 通用空壳 APK（不内置 math/en，内容改由热更包下发；保留 cn 作离线兜底）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chinese-universal
            artifact: ChinesePlayground-apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ★ 空壳模式（workflow_dispatch 勾选 empty_shell）：剥离 chinese-universal 内置的 math/en，
      #   仅保留 cn 作离线兜底。产出的即 2.5.0「通用空壳」——三科内容全部走热更包下发。
      #   注意：本步只删 Android assets 里的 math/en，不动仓库根的源；boot.js 的 BUILTIN_MATH/EN
      #   清单照旧，运行时由已安装的热更包按同路径顶替（首开无包时选数学/英语会白屏，装包即正常）。
      - name: 空壳模式：剥离 math/en 内置资源
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.empty_shell == 'true' }}
        run: |
          echo "═══ EMPTY_SHELL：移除 ${{ matrix.project }} 内置的 math/en（保留 cn 作离线兜底）═══"
          rm -rf "${{ matrix.project }}/app/src/main/assets/math" "${{ matrix.project }}/app/src/main/assets/en"
          echo "剥离后 assets 内容："
          ls "${{ matrix.project }}/app/src/main/assets"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # runner 已预装 Android SDK（$ANDROID_HOME 含 API34 / build-tools 34.0.0），
      # 不用第三方 setup-android（近期不稳定，曾导致构建在 16s 内失败）
      - name: Accept Android SDK licenses
        run: 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true'

      - name: Install SDK platform & build-tools (API 34)
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"'

      - name: Download Gradle 8.2 (repo 未带 wrapper jar)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip -d "$HOME/gradle_dist"
          echo "$HOME/gradle_dist/gradle-8.2/bin" >> "$GITHUB_PATH"

      - name: Disable lintVital for release
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/lint.gradle" <<'EOF'
          allprojects { p -> p.afterEvaluate {
            try { p.android.lintOptions.checkReleaseBuilds = false } catch (e) { }
          } }
          EOF

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/ks"
          printf '%s' "$KS_B64" | base64 -d > "$HOME/ks/release.jks"
          chmod 600 "$HOME/ks/release.jks"

      - name: Build release APK (unsigned)
        working-directory: ${{ matrix.project }}
        run: gradle assembleRelease --no-daemon

      - name: Sign APK (apksigner)
        env:
          KS_PASS:   ${{ secrets.KEYSTORE_STORE_PASS }}
          KEY_PASS:  ${{ secrets.KEYSTORE_KEY_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -n "$APKSIGNER" ] || { echo "apksigner not found under $ANDROID_HOME"; exit 1; }
          echo "using $APKSIGNER"
          REL="${{ matrix.project }}/app/build/outputs/apk/release"
          UNSIGNED="$REL/app-release-unsigned.apk"
          [ -f "$UNSIGNED" ] || { echo "unsigned APK missing"; ls -R "$REL"; exit 1; }
          "$APKSIGNER" sign --ks "$HOME/ks/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" \
            --min-sdk-version 21 \
            --v1-signing-enabled true --v2-signing-enabled true \
            --v3-signing-enabled false --v4-signing-enabled false \
            --out "$REL/app-release-signed.apk" "$UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$REL/app-release-signed.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.project }}/app/build/outputs/apk/release/app-release-signed.apk

  smoke:
    name: 冒烟测试（四模式）
    runs-on: ubuntu-latest
    # ① 不 needs build、② pages 也不 needs 它 ——
    #   这是刻意的：测试脚本要是哪天自己卡住或失灵，最多是这一格变红，
    #   绝不能把热更包和 APK 的发布链条一起拖下水。
    #   node_modules 已随仓库提交，CI 里直接跑得起来，不用联网 npm install。
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run smoke (picker / cn / math / en)
        run: node tools/smoke.mjs

      # 老 APK（2.4.x）走的是另一条完全不同的加载路径：boot.js 冻结、清单写死，
      # 全靠资源包里的桥接层 + 同路径空壳把三科接上来。tools/smoke.mjs 测的是新版宿主，
      # 那条路径半点不覆盖 —— 桥接层一破，「更新了却还是只有语文」不会有任何一格变红。
      # 这台 IFN（if and only if）的验证必须与上面那条并存，缺一不可。
      - name: Run legacy bridge smoke (2.4.x → 三科)
        run: node tools/smoke-legacy.mjs

      # 2026-09-20 现场事故：1080p 机顶盒两侧各一道竖直"接缝"、整页被压扁。
      # 根因不是某处写错，而是 #app 宽度有三处各写各的（shell 520px / 语文乘了 --s / 数学英语靠横屏断点）。
      # 这类"三处分开看都合理"的问题人眼看不出来，只能靠机械规则卡住。
      - name: Check TV layout redlines (容器宽度唯一真源 / 不乘 --s / 老 WebView 红线写法)
        run: node tools/check-tv-layout.mjs

  pages:
    name: Deploy H5 + 热更包 (GitHub Pages)
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect H5 files
        run: |
          mkdir -p page
          cp index.html page/
          cp -r css js page/
          # 三科子目录必须带上：它们既是「图片兜底源」的来源（cn/img），
          # 也是 unit/file-less 浏览器直接打开 index.html 时的学科代码来源。
          for d in cn math en; do [ -d "$d" ] && cp -r "$d" page/; done

      - name: 生成热更包（旧通道，v2 及更早的 APK 还在读 hot/manifest.js）
        run: |
          REPO="${{ github.event.repository.name }}"
          node tools/gen-hot.mjs --out page/hot \
            --base "https://${{ github.repository_owner }}.github.io/${REPO}/hot/"

      # 以前这段注释写的是「min_apk 默认取 build.gradle 的 versionCode，写死 3 浪费流量」——
      # 那是错的，而且代价极大：见 tools/gen-pack.mjs 里 2026-09-20 那次事故。
      # 门槛一抬，所有比它旧的机器就把整份包拒收，界面毫无变化，看起来像「热更失效」。
      # 现在默认值固定为 3，需要抬高只能显式 --min-apk N。
      - name: 生成资源包（v3.0 通道：任意格式 + 玩法热更）
        run: node tools/gen-pack.mjs --out page/hot/pack

      # 【守住老设备的命门】上面那步一旦又把 min_apk 抬到跟 versionCode 一样，
      # 现场机器（versionCode 更低）会整份拒收 —— 症状是「明明有更新却什么都没变」。
      # 让它在这里直接红，别等到用户截图才发现。
      - name: 校验 min_apk 没把老设备挡在门外
        run: |
          M=$(node -e "console.log(require('./page/hot/pack/manifest.json').min_apk)")
          echo "min_apk=$M"
          if [ "$M" -gt 3 ]; then
            echo "❌ min_apk=$M 会把 versionCode < $M 的设备整条热更挡掉（boot.js: DEV.apk < m.min_apk）"
            exit 1
          fi

      # 【双发，别删】boot.js 里 installPack 用的是「base + pk.name」，而 pk.name 是裸文件名：
      # 实际下载 URL 是 .../hot/code.zip，不是 .../hot/pack/code.zip。
      # 只发 pack/ 子目录时，设备能读到 manifest 却在下载 zip 时 404 —— 表现为「热更一直装不上」。
      # 所以 zip 必须在 hot/ 根和 hot/pack/ 各放一份（2.3.2 那次修复就是手工双发救回来的，这里固化进 CI）。
      - name: 双发热更 zip 到 hot/ 根（老壳的 URL 不带 pack/ 前缀）
        run: |
          mkdir -p page/hot
          for z in page/hot/pack/*.zip; do cp -f "$z" "page/hot/$(basename "$z")"; done
          ls -la page/hot/*.zip

      - name: 下载已签名 APK（构建失败时跳过，不影响热更发布）
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: apks

      - name: APK 放进 page（应用内升级用）
        run: |
          mkdir -p page/apk
          if [ -d apks ]; then
            for d in apks/*/; do
              n=$(basename "$d")
              out=$(echo "$n" | sed -E 's/-apk$//').apk
              find "$d" -name '*.apk' -exec cp {} "page/apk/$out" \;
            done
          fi
          # 签名 Secrets 没配时构建产不出 APK：退回仓库里已发布的那一份，
          # 保证 Pages 上的下载直链永远有东西可以下
          if [ -z "$(ls -A page/apk 2>/dev/null)" ] && [ -d apk ]; then
            cp apk/*.apk page/apk/ 2>/dev/null || true
          fi
          ls -la page/apk

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./page
          force_orphan: true

      # gh-pages 是「移动分支」，jsDelivr 对分支内容按 12 小时 TTL 缓存：
      # 不主动清，发布后 cdn.jsdelivr.net 上还是旧文件。曾踩坑 ——
      # 旧清单里的 min_apk=10 把 2.2.x(versionCode 7) 老设备的热更整条挡掉，
      # 而客户端只在「网络失败」时才换源，拿到旧清单不换源 → 静默放弃热更。
      - name: 清 jsDelivr 缓存并校验（清单 / 升级配置 / 资源包）
        continue-on-error: true
        run: |
          REPO="${{ github.repository }}"
          sleep 45        # 等 Pages 边缘把新文件发出去，否则清完立刻回源可能又抓到旧的
          PATHS="hot/pack/manifest.json hot/update.js hot/manifest.js"
          if [ -f page/hot/pack/manifest.json ]; then
            PATHS="$PATHS $(node -e "const m=require('./page/hot/pack/manifest.json');(m.packs||[]).forEach(p=>console.log('hot/pack/'+p.name))" | tr '\n' ' ')"
          fi
          for p in $PATHS; do
            echo "== purge $p"
            curl -sS --max-time 30 "https://purge.jsdelivr.net/gh/$REPO@gh-pages/$p" || true
            echo
          done
          # 校验：cdn 上的 build 必须等于刚生成的 build，不等于就再清一次（最多 3 轮）
          WANT=$(node -e "console.log(require('./page/hot/pack/manifest.json').build)")
          for i in 1 2 3; do
            GOT=$(curl -sS --max-time 20 "https://cdn.jsdelivr.net/gh/$REPO@gh-pages/hot/pack/manifest.json" \
                  | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).build)}catch(e){console.log('parse-err')}})")
            echo "cdn build=$GOT  want=$WANT"
            [ "$GOT" = "$WANT" ] && break
            curl -sS --max-time 30 "https://purge.jsdelivr.net/gh/$REPO@gh-pages/hot/pack/manifest.json" || true
            sleep 20
          done
