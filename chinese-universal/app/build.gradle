apply plugin: 'com.android.application'

android {
    namespace 'com.example.chineseplayground'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.chineseplayground"
        minSdk 21
        targetSdk 34
        versionCode 11
        versionName "2.4.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebView 使用系统组件，无需第三方内核依赖
}
